
name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Jarvis-master-security-reviewed.zip'
      - '.github/workflows/build-Jarvis.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      
      - name: Extract source
        run: |
          unzip -q Jarvis-master-security-reviewed.zip -d source
          PROJECT="source/Jarvis-master"
          test -f "$PROJECT/pubspec.yaml"
          test -f "$PROJECT/android/gradle/wrapper/gradle-wrapper.properties"
          find "$PROJECT/android" -maxdepth 1 -name 'settings.gradle*' -print
          test -f "$PROJECT/android/settings.gradle" || test -f "$PROJECT/android/settings.gradle.kts"

      - name: Upgrade Android build versions
        working-directory: source/Jarvis-master
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Update Gradle wrapper
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          content = wrapper.read_text()
          content, count = re.subn(
              r'gradle-[0-9.]+-(?:all|bin)\.zip',
              'gradle-9.3.1-all.zip',
              content
          )
          if count == 0:
              raise SystemExit("Gradle wrapper URL not found")
          wrapper.write_text(content)

          # Detect either Groovy or Kotlin settings file
          candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle")
          ]
          settings = next((p for p in candidates if p.is_file()), None)
          if settings is None:
              raise SystemExit("Android settings.gradle file not found")

          content = settings.read_text()
          pattern = r'(id\s*\(?\s*["\']com\.android\.application["\']\s*\)?\s+version\s+["\'])[^"\']+'
          content, count = re.subn(pattern, r'\g<1>9.1.1', content)

          if count == 0:
              raise SystemExit(
                  f"Could not find Android Gradle Plugin version in {settings}"
              )

          settings.write_text(content)
          print(f"Updated Android settings: {settings}")
          print("Gradle wrapper and Android Gradle Plugin updated.")
          PY
          
      - name: Install Flutter dependencies
        working-directory: source/Jarvis-master
        run: flutter pub get

      - name: Check Flutter project
        working-directory: source/Jarvis-master
        run: flutter doctor -v

      - name: Build release APK
        working-directory: source/Jarvis-master
        run: flutter build apk --release --verbose

      - name: Verify APK
        working-directory: source/Jarvis-master
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: source/Jarvis-master/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Diagnostics
          path: |
            source/Jarvis-master/build/
            source/Jarvis-master/android/
          retention-days: 7
          if-no-files-found: ignore
