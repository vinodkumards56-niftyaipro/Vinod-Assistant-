name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Jarvis-master.zip'
      - '.github/workflows/build-Jarvis.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source
        run: |
          unzip -q Jarvis-master.zip -d source
          test -f source/Jarvis-master/pubspec.yaml
          
      - name: Upgrade Gradle wrapper for current Flutter
        working-directory: source/Jarvis-master
        run: |
          sed -i 's/gradle-9\.1\.0-all\.zip/gradle-9.3.1-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: source/Jarvis-master
        run: flutter pub get

      - name: Build APK
        working-directory: source/Jarvis-master
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/Jarvis-master/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          
