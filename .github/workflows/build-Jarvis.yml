
name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Jarvis-master.zip'
      - '.github/workflows/build-Jarvis.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract source
        run: |
          unzip -q Jarvis-master.zip -d source
          test -f source/Jarvis-master/pubspec.yaml
          test -f source/Jarvis-master/android/settings.gradle
          test -f source/Jarvis-master/android/gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade Android build versions
        working-directory: source/Jarvis-master
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Upgrade Gradle wrapper
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          s, n = re.subn(
              r'gradle-[0-9.]+-(?:all|bin)\.zip',
              'gradle-9.3.1-all.zip',
              s
          )
          if n == 0:
              raise SystemExit("Gradle distribution URL not found")
          p.write_text(s)

          # Upgrade Android Gradle Plugin
          p = Path("android/settings.gradle")
          s = p.read_text()
          s, n = re.subn(
              r'(com\.android\.application["\']?\s+version\s+["\'])[^"\']+',
              r'\g<1>9.1.1',
              s
          )
          if n == 0:
              raise SystemExit(
                  "AGP version not found in android/settings.gradle; "
                  "please inspect the plugins block."
              )
          p.write_text(s)

          print("Updated Gradle wrapper:")
          print(Path("android/gradle/wrapper/gradle-wrapper.properties").read_text())
          print("Updated Android settings:")
          print(p.read_text())
          PY

      - name: Install Flutter dependencies
        working-directory: source/Jarvis-master
        run: flutter pub get

      - name: Check Flutter project
        working-directory: source/Jarvis-master
        run: flutter doctor -v

      - name: Build release APK
        working-directory: source/Jarvis-master
        run: flutter build apk --release --verbose

      - name: Verify APK
        working-directory: source/Jarvis-master
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: source/Jarvis-master/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Diagnostics
          path: |
            source/Jarvis-master/build/
            source/Jarvis-master/android/
          retention-days: 7
          if-no-files-found: ignore
